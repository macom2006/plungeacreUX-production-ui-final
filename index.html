<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Start online care with Plunge Care through licensed provider review, clear next steps, and transparent payment timing."
    />
    <link rel="icon" type="image/png" href="/src/assets/plunge-care-logo.png" />
    <title>Plunge Care</title>
    <style>
      .direct-open-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f8fa;
        color: #102033;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .direct-open-fallback__card {
        max-width: 560px;
        border: 1px solid #d9e1ea;
        border-radius: 12px;
        background: #ffffff;
        padding: 32px;
        box-shadow: 0 1px 2px rgb(16 32 51 / 8%);
      }

      .direct-open-fallback__eyebrow {
        margin: 0 0 8px;
        color: #0f5da8;
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .direct-open-fallback h1 {
        margin: 0 0 12px;
        color: #051e4f;
        font-size: 32px;
        line-height: 1.2;
      }

      .direct-open-fallback p {
        margin: 0;
        color: #536170;
        line-height: 1.5;
      }

      .direct-open-fallback p + p {
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="direct-open-fallback">
        <section
          aria-labelledby="direct-open-title"
          class="direct-open-fallback__card"
        >
          <p class="direct-open-fallback__eyebrow">Plunge Care</p>
          <h1 id="direct-open-title">
            Start the local preview server
          </h1>
          <p>
            This React app is built with Vite and will not render correctly when
            the raw <code>index.html</code> file is opened directly.
          </p>
          <p>
            Run <code>npm run dev</code>, then open
            <code>http://127.0.0.1:5173/</code>.
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
